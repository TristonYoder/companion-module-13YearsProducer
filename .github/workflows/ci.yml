name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      # Fails if package.json and companion/manifest.json disagree — the
      # manifest is what Companion shows users.
      - run: npm run check-version
      - run: npm run build
      - run: npm run lint
      - run: npm run test:unit
      - run: npx companion-module-check
      - run: npx companion-module-build
